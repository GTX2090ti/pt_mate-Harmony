name: pt_mate
description: "PT-Mate - A private tracker torrent management app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.29.5+215

environment:
  # [移植适配-OHOS] 上游要求 Dart 3.13；鸿蒙定制 SDK 暂无 Dart≥3.13 版本，暂放宽到 ^3.11.0，升级工具链后恢复。
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.11.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  http_parser: ^4.1.0
  dynamic_color: ^1.7.0
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  # flutter_local_notifications: ^22.0.1 # 无 ohos 端口，鸿蒙移植禁用（移植自留 TODO stub）
  # flutter_downloader: ^1.11.8 # lib 零引用，移除
  # ota_update: ^7.0.2 # 无 ohos 端口，鸿蒙移植禁用
  device_info_plus: ^11.3.0
  dart_jsonwebtoken: ^3.1.1
  # [移植适配-OHOS] flutter_test 固定 clock 1.1.2，上移约束会导致版本求解失败。
  clock: ^1.1.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_bbcode: ^1.5.1
  bbob_dart: ^0.2.1
  archive: ^4.0.9
  # webview_flutter: ^4.9.0 # lib 零引用（统一用 flutter_inappwebview），移除
  # webview_flutter_android: ^4.12.0 # 同上
  # [移植适配-OHOS] flutter_inappwebview 6.1.5 官方无 ohos 端口，
  # 改用 OpenHarmony-SIG 维护的鸿蒙移植版 br_v6.1.5_ohos 分支（底层走系统 ArkWeb 内核）。
  # 注：git 依赖在 Windows 无开发者模式下需 symlink 无法解析，落为本地副本 path 依赖。
  flutter_inappwebview:
    path: packages/flutter_inappwebview_ohos/flutter_inappwebview
  beautiful_soup_dart: ^0.3.0
  file_picker: ^10.3.0
  webdav_client: ^1.2.2
  flutter_svg: ^2.0.10
  uuid: ^4.5.1
  flutter_markdown_plus: ^1.0.7
  logger: ^2.6.2
  get_it: ^9.0.5
  image: ^4.1.7
  share_plus: ^11.0.0
  xml: ^7.0.1
  html: ^0.15.6
  flutter_widget_from_html_core: ^0.17.0
  toastification: ^3.0.3
  flutter_native_splash: ^2.4.1



dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # 添加这一行


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/logo/
    - assets/sites/
    - assets/sites_icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  # [上游] webdav_client 1.2.2 still declares xml ^6.2.2, but only uses DOM APIs
  # retained by xml 7. Keep the project on the audited xml 7 line.
  xml: ^7.0.1
  # [上游] encrypt 5.0.3 still caps PointyCastle at 3.x. Its AES surface used here is
  # compatible with 4.x, which is required by dart_jsonwebtoken 3.4.1.
  pointycastle: ^4.0.0
  # [移植适配-OHOS] flutter_secure_storage 10.x 的平台白名单只覆盖
  # web/linux/iOS/Android/Windows/macOS，ohos 会落到 _selectOptions() 的
  # else 分支直接抛 UnsupportedError，调用根本到不了 MethodChannel，
  # 表现为启动时 code=unsupportederror。此处指向本地补丁副本（已加 ohos 分支），
  # 配合 ArkTS 侧实现（plugins.it_nomads.com/flutter_secure_storage）完成闭环。
  flutter_secure_storage:
    path: packages/flutter_secure_storage_ohos
  # [移植适配-OHOS] file_picker 10.x 无 ohos 实现：
  #   - pickFiles 走 MethodChannel 但无接收端 → MissingPluginException
  #   - saveFile  因 Platform.isAndroid/isIOS 均为 false，落到基类 throw UnimplementedError
  # 本地副本补了 isOhos 分支，配合 ArkTS 侧 FilePickerOhos.ets（系统 DocumentViewPicker）闭环。
  file_picker:
    path: packages/file_picker_ohos


flutter_launcher_icons:
  remove_alpha_ios: true
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/pt_mate_icon_opaque.png"
  adaptive_icon_background: "#4D74FF"
  adaptive_icon_foreground: "assets/logo/pt_mate_foreground.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "mt.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "mt.png"
    icon_size: 128 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "mt.png"

flutter_native_splash:
  color: "#4D74FF"
  color_dark: "#4D74FF"
  image: assets/logo/pt_mate_splash_trimmed.png
  android: true
  ios: true
  web: false
  android_12:
    image: assets/logo/pt_mate_splash_trimmed.png
    color: "#4D74FF"
    color_dark: "#4D74FF"
